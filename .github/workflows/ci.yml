name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install tools
        uses: jdx/mise-action@v4
        with:
          install: true

      - name: Check whitespace
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          else
            git diff-tree --check --no-commit-id --root -r HEAD
          fi

      - name: Run tests
        run: mise run test

      - name: Run convention lints
        run: codebase lint "$PWD"

      - name: Check generated README
        uses: ./
        with:
          check: true

      - name: Check generated command docs
        run: |
          README_CALLER_PWD="$PWD" mise run docs
          git diff --exit-code -- docs/index.html
